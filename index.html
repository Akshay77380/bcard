<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10241D">
  <meta name="description" content="A digital business card. The link is the card.">
  <title>B Card</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%231C3D32' width='32' height='32' rx='6'/%3E%3C/svg%3E">
  <script>
    // GitHub Pages serves unknown paths from 404.html, which returns here
    // with the original path in the query. Put that path back before render.
    (function (location) {
      if (location.search[1] === '/') {
        var decoded = location.search.slice(1).split('&').map(function (part) {
          return part.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, '', location.pathname.slice(0, -1) + decoded + location.hash);
      }
    }(window.location));
  </script>
  <style>
    @font-face {
      font-family: Newsreader;
      src: url("fonts/Newsreader-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: Newsreader;
      src: url("fonts/Newsreader-Semibold.ttf") format("truetype");
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: Outfit;
      src: url("fonts/Outfit-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: Outfit;
      src: url("fonts/Outfit-Medium.ttf") format("truetype");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: Outfit;
      src: url("fonts/Outfit-Semibold.ttf") format("truetype");
      font-weight: 600;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --canvas: #F3EEE4;
      --ink: #1A2420;
      --forest: #1C3D32;
      --deep: #10241D;
      --moss: #2F6B4F;
      --copper: #8C5A32;
      --line: #E2D8C8;
      --paper: #FFFBF5;
      --mist: #6E675C;
      --on-brand: #FFFBF5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--deep);
      color: var(--paper);
      font-family: Outfit, sans-serif;
    }
    main {
      width: min(520px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .mark {
      font-family: Newsreader, serif;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .card {
      background: var(--paper);
      color: var(--ink);
      border-radius: 22px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .band {
      background: var(--forest);
      color: var(--on-brand);
      min-height: 8px;
      padding: 14px 20px;
    }
    .band:empty { padding: 8px 0; }
    .body { padding: 18px 20px 20px; min-width: 0; }
    .company {
      margin: 0;
      color: var(--on-brand);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Newsreader, serif;
      font-weight: 600;
      font-size: 32px;
      line-height: 1.1;
    }
    .title {
      margin: 4px 0 0;
      color: var(--copper);
      font-weight: 500;
      font-size: 16px;
    }
    .bio {
      margin: 12px 0 0;
      color: var(--mist);
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    ul {
      list-style: none;
      margin: 16px 0 0;
      padding: 12px 0 0;
      border-top: 1px solid var(--line);
    }
    li { margin: 0 0 6px; }
    a.row, span.row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      line-height: 1.4;
    }
    a.row:hover { color: var(--forest); }
    .actions { display: grid; gap: 10px; margin-top: 18px; }
    button, a.button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font: 600 15px Outfit, sans-serif;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .primary { background: var(--paper); color: var(--ink); }
    .ghost {
      background: transparent;
      color: var(--paper);
      border: 1px solid rgba(255, 251, 245, 0.4);
    }
    .empty {
      margin-top: 28px;
      font-size: 18px;
      line-height: 1.45;
    }
    .empty p { color: rgba(255, 251, 245, 0.78); font-size: 15px; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    var app = document.getElementById('app');

    function cardCode() {
      var parts = location.pathname.split('/').filter(Boolean);
      var index = parts.indexOf('p');
      if (index < 0 || index + 1 >= parts.length) return '';
      return decodeURIComponent(parts[index + 1]);
    }

    function decodeCard(code) {
      try {
        var normalized = code.trim().replace(/-/g, '+').replace(/_/g, '/');
        while (normalized.length % 4 !== 0) normalized += '=';
        var binary = atob(normalized);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        var raw = JSON.parse(new TextDecoder().decode(bytes));
        if (!raw || typeof raw !== 'object' || !raw.id || !raw.n) return null;
        return raw;
      } catch (error) {
        return null;
      }
    }

    function text(value) {
      return (value || '').trim();
    }

    function websiteUrl(raw) {
      var value = text(raw);
      if (!value) return '';
      return value.indexOf('://') >= 0 ? value : 'https://' + value;
    }

    function linkedinUrl(raw) {
      var value = text(raw);
      if (!value) return '';
      if (value.indexOf('://') >= 0) return value;
      if (value.indexOf('linkedin.com') >= 0) return 'https://' + value;
      var handle = value.charAt(0) === '@' ? value.slice(1) : value;
      return 'https://www.linkedin.com/in/' + handle;
    }

    function displayUrl(url) {
      return url.replace(/^https?:\/\/(www\.)?/, '');
    }

    function escapeVCard(value) {
      return value
        .replace(/\\/g, '\\\\')
        .replace(/\n/g, '\\n')
        .replace(/,/g, '\\,')
        .replace(/;/g, '\\;');
    }

    function slug(name) {
      var value = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      return value || 'card';
    }

    function buildVCard(card) {
      var lines = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + escapeVCard(card.n), 'N:' + escapeVCard(card.n) + ';;;'];
      if (text(card.c)) lines.push('ORG:' + escapeVCard(text(card.c)));
      if (text(card.t)) lines.push('TITLE:' + escapeVCard(text(card.t)));
      if (text(card.p)) lines.push('TEL;TYPE=CELL:' + escapeVCard(text(card.p)));
      if (text(card.e)) lines.push('EMAIL;TYPE=INTERNET:' + escapeVCard(text(card.e)));
      var website = websiteUrl(card.w);
      if (website) lines.push('URL:' + escapeVCard(website));
      var linkedin = linkedinUrl(card.l);
      if (linkedin) lines.push('URL:' + escapeVCard(linkedin));
      if (text(card.o)) lines.push('ADR;TYPE=WORK:;;' + escapeVCard(text(card.o)) + ';;;;');
      if (text(card.b)) lines.push('NOTE:' + escapeVCard(text(card.b)));
      lines.push('END:VCARD');
      return lines.join('\r\n') + '\r\n';
    }

    function el(tag, className, content) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (content) node.textContent = content;
      return node;
    }

    function row(href, label) {
      var node = href ? document.createElement('a') : el('span', 'row');
      if (href) {
        node.className = 'row';
        node.href = href;
        if (href.indexOf('http') === 0) {
          node.target = '_blank';
          node.rel = 'noopener noreferrer';
        }
      }
      node.appendChild(el('span', '', label));
      var item = document.createElement('li');
      item.appendChild(node);
      return item;
    }

    function renderEmpty() {
      var header = el('header');
      header.appendChild(el('div', 'mark', 'B Card'));
      var empty = el('section', 'empty');
      empty.appendChild(el('h1', '', 'This link is a business card.'));
      empty.appendChild(el('p', '', 'Open a card someone shared with you. The page reads the link itself, so there is nothing to sign in to.'));
      app.appendChild(header);
      app.appendChild(empty);
    }

    function mix(base, other, amount) {
      return base.map(function (from, index) {
        return Math.round(from + (other[index] - from) * amount);
      });
    }
    function channelLuma(value) {
      var scaled = value / 255;
      return scaled <= 0.03928 ? scaled / 12.92 : Math.pow((scaled + 0.055) / 1.055, 2.4);
    }
    function luminance(rgb) {
      return 0.2126 * channelLuma(rgb[0]) + 0.7152 * channelLuma(rgb[1]) + 0.0722 * channelLuma(rgb[2]);
    }
    function contrast(a, b) {
      var lighter = Math.max(luminance(a), luminance(b));
      var darker = Math.min(luminance(a), luminance(b));
      return (lighter + 0.05) / (darker + 0.05);
    }
    function cssHex(rgb) {
      return '#' + rgb.map(function (value) {
        return Math.max(0, Math.min(255, value)).toString(16).padStart(2, '0');
      }).join('');
    }
    function darkenToLuminance(color, target) {
      var current = color.slice();
      for (var step = 0; step < 18; step++) {
        if (luminance(current) <= target) return current;
        current = mix(current, [0, 0, 0], 0.28);
      }
      return current;
    }
    function applyPalette(raw) {
      if (!raw || !/^[0-9A-Fa-f]{6}$/.test(raw)) return;
      var brand = [
        parseInt(raw.slice(0, 2), 16),
        parseInt(raw.slice(2, 4), 16),
        parseInt(raw.slice(4, 6), 16)
      ];
      var cream = [255, 251, 245];
      var inkSeed = [26, 24, 20];
      var paper = mix(cream, brand, 0.09);
      var accent = brand.slice();
      for (var step = 0; step < 14; step++) {
        if (contrast(accent, paper) >= 4.5) break;
        accent = mix(accent, inkSeed, 0.22);
      }
      var tinted = mix(inkSeed, brand, 0.18);
      var ink = contrast(tinted, paper) >= 4.5 ? tinted : accent;
      var bar = contrast(cream, brand) >= 4.5 || contrast(inkSeed, brand) >= 4.5 ? brand : accent;
      var onBrand = contrast(cream, bar) >= contrast(inkSeed, bar) ? cream : inkSeed;
      var root = document.documentElement.style;
      root.setProperty('--paper', cssHex(paper));
      root.setProperty('--ink', cssHex(ink));
      root.setProperty('--forest', cssHex(bar));
      root.setProperty('--copper', cssHex(accent));
      root.setProperty('--mist', cssHex(mix(ink, paper, 0.42)));
      root.setProperty('--line', cssHex(mix(paper, brand, 0.22)));
      root.setProperty('--deep', cssHex(darkenToLuminance(brand, 0.07)));
      root.setProperty('--on-brand', cssHex(onBrand));
      root.setProperty('--moss', cssHex(bar));
    }

    function renderCard(card, code) {
      document.title = card.n + ' · B Card';
      applyPalette(card.k);
      var header = el('header');
      header.appendChild(el('div', 'mark', 'B Card'));
      app.appendChild(header);

      var cardEl = el('article', 'card');
      var band = el('div', 'band');
      if (text(card.c)) band.appendChild(el('p', 'company', text(card.c)));
      cardEl.appendChild(band);
      var body = el('div', 'body');
      body.appendChild(el('h1', '', card.n));
      if (text(card.t)) body.appendChild(el('p', 'title', text(card.t)));
      if (text(card.b)) body.appendChild(el('p', 'bio', text(card.b)));

      var list = document.createElement('ul');
      if (text(card.p)) list.appendChild(row('tel:' + text(card.p).replace(/ /g, ''), text(card.p)));
      if (text(card.e)) list.appendChild(row('mailto:' + text(card.e), text(card.e)));
      var website = websiteUrl(card.w);
      if (website) list.appendChild(row(website, displayUrl(website)));
      var linkedin = linkedinUrl(card.l);
      if (linkedin) list.appendChild(row(linkedin, displayUrl(linkedin)));
      if (text(card.o)) {
        list.appendChild(row(
          'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(text(card.o)),
          text(card.o)
        ));
      }
      if (list.childNodes.length) body.appendChild(list);
      cardEl.appendChild(body);
      app.appendChild(cardEl);

      var actions = el('div', 'actions');
      var save = el('button', 'primary', 'Save to contacts');
      save.type = 'button';
      save.addEventListener('click', function () {
        var blob = new Blob([buildVCard(card)], { type: 'text/vcard' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = slug(card.n) + '.vcf';
        link.click();
        URL.revokeObjectURL(link.href);
      });
      var open = el('a', 'button ghost', 'Open in the B Card app');
      open.href = 'bcard://open/p/' + code;
      actions.appendChild(save);
      actions.appendChild(open);
      app.appendChild(actions);
    }

    var code = cardCode();
    var card = code ? decodeCard(code) : null;
    if (!card) renderEmpty();
    else renderCard(card, code);
  </script>
</body>
</html>
